<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Badge with slight shadow -->
  <rect width="90" height="90" x="5" y="5" rx="24" fill="#FFFFFF" filter="url(#softShadow)" />
  
  <!-- Chef Bot Head & Hat -->
  <g>
    <!-- White Chef Hat -->
    <path d="M 22 46 C 22 18, 78 18, 78 46 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <circle cx="36" cy="27" r="14" fill="#FFFFFF" />
    <circle cx="50" cy="20" r="16" fill="#FFFFFF" />
    <circle cx="64" cy="27" r="14" fill="#FFFFFF" />
    <rect x="26" y="40" width="48" height="10" rx="3" fill="#E2E8F0" />

    <!-- Ear Bolts (Charcoal) -->
    <rect x="18" y="62" width="6" height="14" rx="2" fill="#23322D" />
    <rect x="76" y="62" width="6" height="14" rx="2" fill="#23322D" />

    <!-- Head (Clean White) -->
    <rect x="23" y="50" width="54" height="40" rx="14" fill="#FFFFFF" />
    
    <!-- Face Screen -->
    <rect x="29" y="56" width="42" height="28" rx="8" fill="#23322D" />
    
    <!-- Glowing Neon Eyes (Smiling Arches) -->
    <path d="M 35 68 Q 41 62 47 68" fill="none" stroke="#0BE49B" stroke-width="3" stroke-linecap="round" />
    <path d="M 53 68 Q 59 62 65 68" fill="none" stroke="#0BE49B" stroke-width="3" stroke-linecap="round" />
    
    <!-- Glowing Neon Mouth (Smile) -->
    <path d="M 43 76 Q 50 82 57 76" fill="none" stroke="#0BE49B" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
