<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Badge -->
  <rect width="100" height="100" rx="24" fill="#23322D" />
  
  <!-- Chef Bot Head & Hat -->
  <g>
    <!-- White Chef Hat -->
    <path d="M 22 46 C 22 18, 78 18, 78 46 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <circle cx="36" cy="27" r="14" fill="#FFFFFF" />
    <circle cx="50" cy="20" r="16" fill="#FFFFFF" />
    <circle cx="64" cy="27" r="14" fill="#FFFFFF" />
    <rect x="26" y="40" width="48" height="10" rx="3" fill="#E2E8F0" />

    <!-- Head & Ear Bolts -->
    <rect x="17" y="62" width="6" height="14" rx="2" fill="#045137" />
    <rect x="77" y="62" width="6" height="14" rx="2" fill="#045137" />
    <rect x="23" y="50" width="54" height="40" rx="14" fill="#CEE9DF" stroke="#045137" stroke-width="1.5" />
    
    <!-- Face Screen -->
    <rect x="30" y="56" width="40" height="26" rx="7" fill="#23322D" />
    
    <!-- Glowing Neon Eyes (Smiling Arches) -->
    <path d="M 36 67 Q 42 61 48 67" fill="none" stroke="#0BE49B" stroke-width="3" stroke-linecap="round" />
    <path d="M 52 67 Q 58 61 64 67" fill="none" stroke="#0BE49B" stroke-width="3" stroke-linecap="round" />
    
    <!-- Glowing Neon Mouth (Smile) -->
    <path d="M 43 76 Q 50 82 57 76" fill="none" stroke="#0BE49B" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
